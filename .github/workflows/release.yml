name: Release

# Trigger: push a tag like  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write   # needed to create the GitHub Release

    runs-on: windows-latest
    name: Build · Windows x64

    steps:
      - uses: actions/checkout@v4

      # ── JavaScript toolchain 
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # ── Rust toolchain
      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── Frontend deps 
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # ── Build + publish release 
      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # ── API keys ─────────────────────────────────────────────────────
          # Keys are NOT baked in at build time.
          # Users supply their own keys at runtime via the Settings screen
          # (first-run prompt — v0.2.0). The binary ships with no keys.

        with:
          tagName:      ${{ github.ref_name }}
          releaseName:  "buddy ${{ github.ref_name }}"
          releaseBody:  |
            ## buddy ${{ github.ref_name }}

            ### Downloads

            | Platform | File |
            |---|---|
            | **Windows x64** | `buddy_*_x64-setup.exe` (recommended) or `buddy_*_x64_en-US.msi` |

            ### ⚠️ API Keys required
            buddy needs your own Anthropic and ElevenLabs API keys.
            Follow the [setup guide in the README](https://github.com/${{ github.repository }}#setup) before running.

          releaseDraft: true    # review before publishing
          prerelease:   false
          tauriScript:  pnpm tauri
